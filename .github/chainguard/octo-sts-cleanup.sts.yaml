# Opts the octo-sts org in to octo-sts.dev's policy cleanup job
# (octo-sts/app#1075). Prod runs it as a dry run for now, so it only logs
# which policies it would remove.
issuer: https://accounts.google.com
# This is octo-sts-policy-cleanup@octo-sts.iam.gserviceaccount.com,
# provisioned by the octo-sts IaC.
subject: "101798790782455855833"
claim_pattern:
  email: octo-sts-policy-cleanup@octo-sts\.iam\.gserviceaccount\.com

permissions:
  # Push a branch removing unused policies.
  contents: write
  # Open the pull request from that branch.
  pull_requests: write
  # Report policies that only fail.
  issues: write
repositories: [] # Every repository in the org.
