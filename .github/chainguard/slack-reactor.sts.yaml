# Octo STS policy for the slack-reactor bot, which reacts to Slack messages
# linking GitHub PRs with the PR's size and review status.

issuer: https://accounts.google.com
subject: "117959345416790619431"

permissions:
  # Read PR state, reviews, and review requests
  pull_requests: read
  # The PR-size query reads the repo root .gitattributes blob
  # (linguist-generated exclusions), which requires contents read
  contents: read
  # Required baseline permission for all GitHub API access
  metadata: read
